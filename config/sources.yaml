  "08":
    slug: cestas_de_regalo
    giro: Regalos
    nicho: Cestas de regalo
    ejemplo: https://www.regalosycanastas.mx/
    sources:
      - id: seed_manual
        kind: seeds
        file: config/seeds/08_cestas_de_regalo.json
